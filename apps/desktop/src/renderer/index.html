<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The panel loads nothing from the network and evaluates no inline script.
      This CSP is part of the renderer's security posture (system-design §14)
      and must survive the move to electron-vite in PR-007.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pilot</title>
    <link rel="stylesheet" href="./renderer.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
