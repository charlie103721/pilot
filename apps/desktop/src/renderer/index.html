<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The panel loads nothing from the network and evaluates no inline script.
      This CSP is part of the renderer's security posture (system-design §14).

      It is shipped byte for byte: `electron.vite.config.ts` fails the build if
      this policy stops matching the copy recorded there, and
      `test/build/development-build.test.ts` compares this file against the
      built `dist/renderer/index.html`. The Vite dev server serves a documented,
      narrower relaxation (inline styles + the HMR websocket) that never reaches
      a packaged build.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pilot</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite entry: rewritten to ./renderer.js (plus an ./index.css link) on build. -->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
